name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build RtxAutoCurveOptimizer.slnx --configuration Release
      # GPU tests need an NVIDIA adapter; hardware read tests skip themselves without nvapi64.dll.
      - name: Test
        run: dotnet test RtxAutoCurveOptimizer.slnx --configuration Release --no-build --filter "Category!=Gpu"
